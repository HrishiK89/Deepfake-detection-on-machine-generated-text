<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot or Human Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("{{ url_for('static', filename='img.jpg') }}");
            background-size: cover;
            background-repeat: no-repeat; /* Prevents duplication */
            text-align: center;
            color: white;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 50%;
            margin: 10% auto;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.3);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        textarea {
            width: 80%;
            height: 100px;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            resize: none;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 18px;
            color: white;
            background: #007BFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            padding: 10px;
            background: rgba(255, 255, 255, 0.2);
            display: inline-block;
            border-radius: 5px;
        }

        .logout {
            position: absolute;
            top: 10px;
            right: 20px;
        }

    </style>
</head>
<body>
    <div class="logout">
        <form action="/logout" method="POST">
            <button type="submit">Logout</button>
        </form>
    </div>

    <div class="container">
        <h1>Bot or Human Detector</h1>
        <form action="/predict" method="POST">
            <textarea name="text" placeholder="Enter text..."></textarea><br>
            <button type="submit">Predict</button>
        </form>

        {% if result %}
            <div class="result">
                Prediction: {{ result }}
            </div>
        {% endif %}
    </div>
</body>
</html>
